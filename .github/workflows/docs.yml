name: docs

# Build the MkDocs site on pushes to main and publish to GitHub Pages.
# Configure the repo: Settings → Pages → "Build and deployment" → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package + docs deps
        run: |
          python -m pip install --upgrade pip
          # Install the package itself so mkdocstrings can import demucs_onnx.
          # Skip the [export] extra to avoid pulling PyTorch into CI.
          # Install the full [export] extra so mkdocstrings can resolve the
          # export module symbols. Pulls in PyTorch for the docs build only.
          pip install -e ".[export]"
          pip install \
            "mkdocs-material>=9.5" \
            "mkdocstrings[python]>=0.25" \
            "pymdown-extensions>=10.0" \
            "mkdocs-material-extensions>=1.3" \
            "black>=24.0"

      - name: Build site
        run: mkdocs build --strict --site-dir _site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
